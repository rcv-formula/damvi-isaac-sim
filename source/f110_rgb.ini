### tire parameters (minimum lap time optimization)
# c_roll:                       [-] rolling resistance coefficient
# f_z0:                         [N] nominal normal force. Must be on the scale of the actual wheel loads
#                               (static: front ~5.9N, rear ~3.9N per wheel) or the eps load sensitivity is dead
# eps sign:                     negative = grip saturates as wheel load rises above f_z0; eps_rear 0.0 models the
#                               wider rear tires keeping their grip under load, unlike the narrower fronts
# B_front:                      [-] Coefficient B for front tire
# C_front:                      [-] Coefficient C for front tire
# eps_front:                    [-] load dependence of Coefficient D for front tire
# E_front:                      [-] Coefficient E for front tire
# B_rear:                       [-] Coefficient B for rear tire
# C_rear:                       [-] Coefficient C for rear tire
# eps_rear:                     [-] load dependence of Coefficient D for rear tire
# E_rear:                       [-] Coefficient E for rear tire
# mue_speed_model:              optional empirical speed dependency of tire-road friction
#   mode:                       "lateral" keeps straight-line acceleration/braking grip unchanged;
#                               "isotropic" applies the multiplier to both friction-ellipse axes
#   low/high_speed_multiplier:  multiplier applied to the local base mue on the two speed plateaus
#   transition_start/end_mps:   [m/s] C2 quintic transition limits; below start uses low, above end uses high
# Hint: The D parameter of the Magic Formula is determined by D = F_z * mue. mue can be set above in optim_opts_mintime!

