damvi_teleop_ui:
  ros__parameters:
    input_topic: /cmd_vel
    output_topic: /ackermann_drive
    # ackermann matches the vehicle; twist copies all six input components.
    output_type: ackermann
    manual_speed: 2.0
    # (servo_min - offset) / gain = (0.15 - 0.50) / -0.52
    max_steering_angle: 0.6730769230769231
    publish_rate: 50.0
    # 0.0 disables timeout and holds the last autonomous command.
    auto_timeout: 0.5
    frame_id: base_link
